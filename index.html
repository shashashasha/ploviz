<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Program Learning Outcomes — Monochrome</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet" />
  <style>
    /* ─── Design Tokens ─────────────────────────────────── */
    :root {
      --bg:         #e6e0d4;
      --surface:    #ede8de;
      --surface2:   #ddd8ce;
      --border:     #c4bfb4;
      --text:       #1a1916;
      --text-muted: #8a8780;
      --radius:     4px;
      --sidebar-w:  200px;
      --header-h:   44px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'IBM Plex Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ─── Header ─────────────────────────────────────────── */
    .app-header {
      height: var(--header-h);
      background: var(--text);
      color: var(--bg);
      display: flex;
      align-items: center;
      padding: 0 1.25rem;
      flex-shrink: 0;
      gap: 0.75rem;
    }
    .app-header h1 {
      font-size: 0.78rem;
      font-weight: 400;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      flex: 1;
    }
    .header-badge {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.62rem;
      font-weight: 400;
      color: rgba(230,224,212,0.55);
    }

    /* ─── Body Layout ────────────────────────────────────── */
    .app-body {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* ─── Sidebar ────────────────────────────────────────── */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 0;
      overflow-y: auto;
      border-right: 1px solid var(--border);
      background: var(--surface);
    }
    .sidebar-section {
      padding: 0.85rem 0.85rem 0.7rem;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-section:last-child { border-bottom: none; }
    .sidebar-section h3 {
      font-size: 0.55rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      margin-bottom: 0.55rem;
    }
    .filter-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .filter-item {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.72rem;
      cursor: pointer;
      padding: 3px 4px;
      border-radius: 3px;
      transition: background 0.1s;
      user-select: none;
    }
    .filter-item:hover { background: var(--surface2); }
    .filter-item input[type="checkbox"] {
      width: 12px; height: 12px;
      accent-color: var(--text);
      cursor: pointer;
      flex-shrink: 0;
    }
    .filter-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ─── Load CSV button ─────────────────────────────────── */
    .btn-load {
      display: block;
      text-align: center;
      background: var(--text);
      color: var(--bg);
      padding: 0.4rem 0.7rem;
      border-radius: var(--radius);
      font-size: 0.68rem;
      font-family: inherit;
      font-weight: 400;
      letter-spacing: 0.04em;
      cursor: pointer;
      border: none;
      width: 100%;
      transition: opacity 0.15s;
    }
    .btn-load:hover { opacity: 0.8; }
    .btn-load-wrap { padding: 0.7rem 0.85rem; }

    /* ─── Canvas ─────────────────────────────────────────── */
    .canvas-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: var(--bg);
    }
    #main-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ─── Program Graph Node Labels ──────────────────────── */
    .prog-label {
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 16px;
      font-weight: 300;
      pointer-events: none;
      dominant-baseline: middle;
      text-anchor: middle;
      letter-spacing: 0.01em;
    }
    .prog-label--plo {
      font-size: 13px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* ─── Label visibility toggles ───────────────────────── */
    #main-svg.hide-manifestation-labels .prog-node--manifestation { display: none; }
    #main-svg.hide-plo-labels .prog-node--plo,
    #main-svg.hide-plo-labels .prog-link--plo { display: none; }

    /* ─── Artifact circles ────────────────────────────────── */
    .artifact {
      cursor: pointer;
    }

    /* ─── Tooltip ─────────────────────────────────────────── */
    #tooltip {
      position: absolute;
      background: var(--text);
      color: var(--bg);
      border-radius: 3px;
      padding: 0.75rem 0.9rem;
      max-width: 380px;
      min-width: 220px;
      font-size: 0.72rem;
      line-height: 1.55;
      pointer-events: none;
      box-shadow: 0 6px 24px rgba(0,0,0,0.22);
      z-index: 200;
      display: none;
    }
    #tooltip.visible { display: block; }

    .tt-title   { font-weight: 500; font-size: 0.76rem; margin-bottom: 2px; }
    .tt-meta    { font-size: 0.65rem; opacity: 0.55; margin-bottom: 6px; }
    .tt-divider { border: none; border-top: 1px solid rgba(230,224,212,0.18); margin: 6px 0; }
    .tt-excerpt {
      font-size: 0.68rem;
      opacity: 0.8;
      line-height: 1.6;
      margin-bottom: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 6;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .tt-scores-label {
      font-size: 0.6rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      opacity: 0.55;
      margin-bottom: 4px;
    }

    /* ─── PLO filters ────────────────────────────────────── */
    .plo-filter .plo-letter {
      font-weight: 500;
      flex-shrink: 0;
    }

    /* ─── Legend ─────────────────────────────────────────── */
    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.65rem;
      color: var(--text-muted);
      margin-bottom: 5px;
    }
    .legend-ring {
      width: 16px; height: 16px;
      border-radius: 50%;
      border: 1.5px solid var(--text);
      flex-shrink: 0;
    }
    .legend-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--text);
      flex-shrink: 0;
      margin: 0 5px;
    }
    .legend-dot-sm {
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--text);
      flex-shrink: 0;
      margin: 0 6px;
    }

    /* ─── Scrollbar styling ──────────────────────────────── */
    .sidebar::-webkit-scrollbar { width: 3px; }
    .sidebar::-webkit-scrollbar-track { background: transparent; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  </style>
</head>
<body>

<header class="app-header">
  <h1>Program Learning Outcomes</h1>
  <span class="header-badge" id="artifact-count">0 instances</span>
</header>

<div class="app-body">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-section">
      <h3>Program Learning Outcomes</h3>
      <div class="filter-list" id="plo-filters"></div>
    </div>
    <div class="sidebar-section">
      <h3>Legend</h3>
      <div class="legend-item"><span class="legend-ring"></span> Manifestation (size = evidence)</div>
      <div class="legend-item"><span class="legend-dot"></span> PLO</div>
      <div class="legend-item"><span class="legend-dot-sm"></span> Paragraph</div>
    </div>
    <div class="sidebar-section">
      <h3>Labels</h3>
      <div class="filter-list">
        <label class="filter-item">
          <input type="checkbox" id="toggle-manifestation-labels" checked>
          <span>Manifestations</span>
        </label>
        <label class="filter-item">
          <input type="checkbox" id="toggle-plo-labels" checked>
          <span>PLOs</span>
        </label>
      </div>
    </div>
    <div class="sidebar-section">
      <h3>Students</h3>
      <div class="filter-list" id="author-filters"></div>
    </div>
    <div class="btn-load-wrap">
      <label class="btn-load" for="csv-input">+ Load CSV</label>
      <input type="file" id="csv-input" accept=".csv" style="display:none" />
    </div>
  </aside>

  <main class="canvas-wrap" id="canvas-wrap">
    <svg id="main-svg"></svg>
    <div id="tooltip"></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════
   PROGRAM STRUCTURE
   ═══════════════════════════════════════════════════════════ */
const PROGRAM_DATA = {
  plos: [],            // [{ id: 'PLO1', label: 'PLO A', title, description }]
  manifestations: []   // all manifestations across every PLO
};

const EVIDENCE_LABELS = ['No evidence', 'Weak evidence', 'Moderate evidence', 'Strong evidence'];

/* ═══════════════════════════════════════════════════════════
   NORMALIZE PLOs + MANIFESTATIONS
   ═══════════════════════════════════════════════════════════ */
function normalizeProgram(data) {
  const plos = [];
  const manifestations = [];
  Object.entries(data || {}).forEach(([ploKey, plo]) => {
    plos.push({
      id:          ploKey,
      label:       plo.plo || ploKey,
      title:       plo.title || '',
      description: plo.description || ''
    });
    (plo.manifestations || []).forEach(m => {
      // similar is an object { id: score } — keep every non-zero pair, including cross-PLO
      const similar = Object.entries(m.similar || {})
        .filter(([, v]) => v > 0)
        .map(([id, score]) => ({ id, score }));
      manifestations.push({
        id:          m.id,
        title:       m.manifestation || m.id,
        shortLabel:  m.short_label || m.manifestation || m.id,
        plo:         ploKey,
        similar,
        scoreColumn: `${ploKey}_${m.id}`,
        _count:      0,
        _nodeRadius: 16   // default; recomputed by computeManifestationSizes()
      });
    });
  });
  return { plos, manifestations };
}

function ploById(id) {
  return PROGRAM_DATA.plos.find(p => p.id === id);
}

/* ═══════════════════════════════════════════════════════════
   STUDENT ANONYMIZATION
   Each author + thesis title pair maps to a stable 6-letter ID derived
   from a hash of their name initials and thesis-title initials.
   ═══════════════════════════════════════════════════════════ */
const STUDENT_IDS  = new Map();   // "author||title" → "QMRTXA"
const USED_IDS     = new Set();

function initialsOf(text) {
  return (text || '')
    .split(/[^A-Za-z0-9]+/)
    .filter(Boolean)
    .map(w => w[0].toUpperCase())
    .join('');
}

function hashToLetters(str, length = 6) {
  // FNV-1a 32-bit, then base-26 letters
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  let out = '';
  for (let i = 0; i < length; i++) {
    out += String.fromCharCode(65 + (h % 26));
    h = Math.floor(h / 26) ^ Math.imul(h, 0x9e3779b1) >>> 0;
    h >>>= 0;
  }
  return out;
}

function assignStudentIds(rows) {
  const keys = [...new Set(rows.map(r => `${(r.author || '').trim()}||${(r.thesis_title || '').trim()}`))]
    .filter(k => !STUDENT_IDS.has(k))
    .sort();
  keys.forEach(key => {
    const [author, title] = key.split('||');
    const seed = initialsOf(author) + initialsOf(title);
    let counter = 0, id;
    do {
      id = hashToLetters(counter ? `${seed}#${counter}` : seed);
      counter++;
    } while (USED_IDS.has(id));
    USED_IDS.add(id);
    STUDENT_IDS.set(key, id);
  });
}

function studentIdFor(row) {
  return STUDENT_IDS.get(`${(row.author || '').trim()}||${(row.thesis_title || '').trim()}`);
}

function studentLabel(id) {
  return `Student ${id}`;
}

/* ═══════════════════════════════════════════════════════════
   MONOCHROME COLOR SYSTEM
   ═══════════════════════════════════════════════════════════ */
const INK       = '#1a1916';
const INK_FAINT = 'rgba(26,25,22,0.12)';

function artifactFill()  { return INK; }
function nodeColor()     { return INK; }
function ploColor()      { return INK; }

function nodeRadius(d) {
  if (d.type === 'plo')           return 9;
  if (d.type === 'manifestation') return d._nodeRadius || 16;
  return 7;
}

/* ═══════════════════════════════════════════════════════════
   MANIFESTATION RING SIZES — computed from visible artifacts, weighted by score
   ═══════════════════════════════════════════════════════════ */
const SCORE_WEIGHT = { 1: 1, 2: 2, 3: 4 };   // a 3-rated paragraph counts as much as four 1s
const RING_MIN = 8;
const RING_MAX = 81;
const RING_EXPONENT = 0.8;                   // closer to 1 = more contrast between rings

function computeManifestationSizes() {
  const counts = {}, weights = {};
  getVisibleArtifacts().forEach(a => {
    const id = a.targetManifestationId;
    counts[id]  = (counts[id]  || 0) + 1;
    weights[id] = (weights[id] || 0) + (SCORE_WEIGHT[a.score] || 1);
  });
  const vals = Object.values(weights);
  const maxWeight = vals.length ? Math.max(...vals) : 1;
  const apply = m => {
    m._count = counts[m.id] || 0;
    const w = weights[m.id] || 0;
    m._nodeRadius = RING_MIN + Math.pow(w / maxWeight, RING_EXPONENT) * (RING_MAX - RING_MIN);
  };
  PROGRAM_DATA.manifestations.forEach(apply);
  // Keep live simulation node copies in sync so rings resize on student-only filtering
  _manifestationNodes.forEach(apply);
}

/* ═══════════════════════════════════════════════════════════
   ARTIFACT SIZING
   ═══════════════════════════════════════════════════════════ */
const ARTIFACT_RADIUS           = 2;
const ARTIFACT_RADIUS_HOVER     = 4;
const ARTIFACT_COLLISION_RADIUS = 6;

// Higher-scoring paragraphs are slightly more opaque (score 1 → 0.55, 3 → 1)
function artifactOpacity(d) { return ({ 1: 0.55, 2: 0.75, 3: 1 })[d.score] ?? 1; }

/* ═══════════════════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════════════════ */
const state = {
  visiblePlos:           new Set(),
  visibleStudents:       new Set(),
  allArtifacts:          [],
  activeManifestationId: null
};

let svg, svgWidth, svgHeight, zoom;
const SIM_W = 4000;
const SIM_H = 4000;
let sim1, sim2;
let progLinkSel, progNodeSel, artNodeSel;
let _programNodes = [], _programLinks = [], _manifestationNodes = [];
let _artifactNodes = [];

/* ═══════════════════════════════════════════════════════════
   DATA PROCESSING
   ═══════════════════════════════════════════════════════════ */
const REQUIRED_COLS = ['author','thesis_title','paragraph'];

// Replace real author names with anonymized student IDs; the author field is dropped.
function anonymizeRow(r) {
  const out = { ...r, studentId: studentIdFor(r) };
  delete out.author;
  return out;
}

function artifactKey(a) {
  return `${a.studentId}||${(a.paragraph||'').slice(0,60)}||${a.targetManifestationId}`;
}

function processData(rows, merge = false) {
  assignStudentIds(rows);
  const expanded = [];
  rows.forEach(r => {
    const base = anonymizeRow(r);
    PROGRAM_DATA.manifestations.forEach(m => {
      // One node per paragraph per manifestation it scores on (zeros are skipped)
      const score = Math.max(0, Math.min(3, Math.round(+(base[m.scoreColumn]) || 0)));
      if (score > 0) {
        expanded.push({
          studentId:     base.studentId,
          thesis_title:  base.thesis_title,
          paragraph:     base.paragraph,
          targetManifestationId: m.id,
          targetPlo:     m.plo,
          score
        });
      }
    });
  });

  const offset = merge ? state.allArtifacts.length : 0;
  expanded.forEach((a, i) => { a._uid = offset + i; });

  if (merge) {
    const existing = new Set(state.allArtifacts.map(artifactKey));
    const fresh = expanded.filter(a => !existing.has(artifactKey(a)));
    state.allArtifacts = [...state.allArtifacts, ...fresh];
    fresh.forEach(a => state.visibleStudents.add(a.studentId));
  } else {
    state.allArtifacts = expanded;
    expanded.forEach(a => state.visibleStudents.add(a.studentId));
  }
}

function getVisibleArtifacts() {
  return state.allArtifacts.filter(a =>
    state.visiblePlos.has(a.targetPlo) &&
    state.visibleStudents.has(a.studentId)
  );
}

/* ═══════════════════════════════════════════════════════════
   SVG SETUP
   ═══════════════════════════════════════════════════════════ */
function setupSVG() {
  const wrap = document.getElementById('canvas-wrap');
  svgWidth  = wrap.clientWidth;
  svgHeight = wrap.clientHeight;

  svg = d3.select('#main-svg')
    .attr('width', svgWidth)
    .attr('height', svgHeight);

  const zoomLayer = svg.append('g').attr('id', 'zoom-layer');
  zoomLayer.append('g').attr('id', 'layer-prog-links');
  zoomLayer.append('g').attr('id', 'layer-art-nodes');
  zoomLayer.append('g').attr('id', 'layer-prog-nodes');

  zoom = d3.zoom()
    .scaleExtent([0.15, 10])
    .on('zoom', (event) => {
      const { x, y, k } = event.transform;
      zoomLayer.attr('transform', `translate(${x},${y}) scale(${k})`);
    });

  svg.call(zoom);
  svg.on('dblclick.zoom', null);
  svg.on('dblclick', () => svg.transition().duration(400).call(zoom.transform, d3.zoomIdentity));

  svg.on('click.clearHighlight touchend.clearHighlight', (event) => {
    if (event.target === svg.node() || event.target === zoomLayer.node()) {
      clearManifestationHighlight();
    }
  });

  new ResizeObserver(() => {
    const w = wrap.clientWidth, h = wrap.clientHeight;
    if (Math.abs(w - svgWidth) < 2 && Math.abs(h - svgHeight) < 2) return;
    svgWidth = w; svgHeight = h;
    svg.attr('width', svgWidth).attr('height', svgHeight);
    if (sim1) sim1.alpha(0.2).restart();
  }).observe(wrap);
}

/* ═══════════════════════════════════════════════════════════
   CUSTOM FORCES
   ═══════════════════════════════════════════════════════════ */
function boundaryForce(getWidth, getHeight, padding) {
  let _nodes = [];
  function force(alpha) {
    const W = getWidth(), H = getHeight();
    const strength = 0.18 * alpha;
    _nodes.forEach(n => {
      const r = (n.type ? nodeRadius(n) : ARTIFACT_RADIUS) + padding;
      if (n.x < r)       n.vx += (r - n.x) * strength;
      if (n.x > W - r)   n.vx -= (n.x - (W - r)) * strength;
      if (n.y < r)       n.vy += (r - n.y) * strength;
      if (n.y > H - r)   n.vy -= (n.y - (H - r)) * strength;
    });
  }
  force.initialize = function(nodes) { _nodes = nodes; };
  return force;
}

function manifestationCircleCollisionForce(manifestationNodes) {
  let _nodes = [];
  function force() {
    _nodes.forEach(artifact => {
      manifestationNodes.forEach(m => {
        if (m.x == null || m.y == null) return;
        const dx   = artifact.x - m.x;
        const dy   = artifact.y - m.y;
        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
        const minDist = nodeRadius(m) + ARTIFACT_COLLISION_RADIUS;
        if (dist < minDist) {
          const push = (minDist - dist) / dist;
          artifact.vx += dx * push * 0.6;
          artifact.vy += dy * push * 0.6;
        }
      });
    });
  }
  force.initialize = function(nodes) {
    _nodes = nodes.filter(n => n.targetManifestationId);
  };
  return force;
}

// Collision force where each artifact's personal space grows the farther it drifts
// from its manifestation ring edge — tight packing near the ring, looser further out.
// Grouped by manifestation so collision is only computed within each cluster (fast).
function distanceScaledCollisionForce(manifestationNodes) {
  const mMap        = new Map(manifestationNodes.map(m => [m.id, m]));
  const nodesByManif = new Map();

  function collisionR(a, mNode) {
    if (!mNode || a.x == null || mNode.x == null) return ARTIFACT_COLLISION_RADIUS;
    const dx = a.x - mNode.x;
    const dy = a.y - mNode.y;
    const distFromCenter = Math.sqrt(dx * dx + dy * dy);
    const distBeyondRing = Math.max(0, distFromCenter - nodeRadius(mNode));
    // At the ring surface → radius ≈ 2.5px (tight); grows 0.14px per pixel further out
    return Math.min(Math.max(ARTIFACT_RADIUS + 0.5, 2.5 + distBeyondRing * 0.12), 40);
  }

  function force() {
    const str = 0.55;
    nodesByManif.forEach((cluster, mId) => {
      const mNode = mMap.get(mId);
      for (let i = 0; i < cluster.length; ++i) {
        const a  = cluster[i];
        const ra = collisionR(a, mNode);
        for (let j = i + 1; j < cluster.length; ++j) {
          const b    = cluster[j];
          const rb   = collisionR(b, mNode);
          const minD = ra + rb;
          const dx   = b.x - a.x;
          const dy   = b.y - a.y;
          const d2   = dx * dx + dy * dy;
          if (d2 < minD * minD && d2 > 0) {
            const d    = Math.sqrt(d2);
            const push = ((minD - d) / d) * str * 0.5;
            a.vx -= dx * push;  a.vy -= dy * push;
            b.vx += dx * push;  b.vy += dy * push;
          }
        }
      }
    });
  }

  force.initialize = function(nodes) {
    nodesByManif.clear();
    nodes.forEach(n => {
      if (!n.targetManifestationId) return;
      let arr = nodesByManif.get(n.targetManifestationId);
      if (!arr) { arr = []; nodesByManif.set(n.targetManifestationId, arr); }
      arr.push(n);
    });
  };

  return force;
}

function customAttractionForce(manifestationNodes) {
  const mMap = new Map(manifestationNodes.map(m => [m.id, m]));
  let _nodes = [];
  function force(alpha) {
    const ATTRACT_K = 0.4 * Math.min(1, (SIM_W * SIM_H) / (900 * 600));
    _nodes.forEach(artifact => {
      const mNode = mMap.get(artifact.targetManifestationId);
      if (!mNode || mNode.x == null || mNode.y == null) return;

      const dx   = mNode.x - artifact.x;
      const dy   = mNode.y - artifact.y;
      const dist = Math.sqrt(dx * dx + dy * dy) || 1;

      // Orbit just outside the ring edge
      const targetDist = nodeRadius(mNode) + ARTIFACT_COLLISION_RADIUS * 0.5 + 4;
      const tension = (dist - targetDist) / dist;

      const s = tension * ATTRACT_K * alpha;
      artifact.vx += dx * s;
      artifact.vy += dy * s;
    });
  }
  force.initialize = function(nodes) {
    _nodes = nodes.filter(n => n.targetManifestationId);
  };
  return force;
}

/* ═══════════════════════════════════════════════════════════
   PLO CIRCLE POSITIONS
   ═══════════════════════════════════════════════════════════ */
function ploCirclePos(ploId) {
  const plos = PROGRAM_DATA.plos;
  const idx = plos.findIndex(p => p.id === ploId);
  if (idx < 0) return { x: SIM_W * 0.30, y: SIM_H * 0.5 };
  const cx = SIM_W * 0.30;
  const cy = SIM_H * 0.50;
  const rx = SIM_W * 0.11;
  const ry = SIM_H * 0.19;
  const angle = (idx / plos.length) * 2 * Math.PI - Math.PI / 4;
  return { x: cx + rx * Math.cos(angle), y: cy + ry * Math.sin(angle) };
}

/* ═══════════════════════════════════════════════════════════
   SIMULATION 1 — Program Graph
   ═══════════════════════════════════════════════════════════ */
function buildProgramSimulation(visiblePlos) {
  const ploNodes = PROGRAM_DATA.plos
    .filter(p => visiblePlos.has(p.id))
    .map(p => ({ ...p, type: 'plo' }));
  const manifestationNodes = PROGRAM_DATA.manifestations
    .filter(m => visiblePlos.has(m.plo))
    .map(m => ({ ...m, type: 'manifestation' }));

  const nodes = [...ploNodes, ...manifestationNodes];
  const nodeById = new Map(nodes.map(n => [n.id, n]));

  const oldPlo = sim1
    ? new Map(sim1.nodes().filter(n => n.type === 'plo').map(n => [n.id, n]))
    : new Map();
  ploNodes.forEach(n => {
    const old = oldPlo.get(n.id);
    if (old) { n.x = old.x; n.y = old.y; n.fx = old.fx; n.fy = old.fy; }
    else { const pos = ploCirclePos(n.id); n.x = pos.x; n.y = pos.y; }
  });

  // Light tether from each PLO to its manifestations
  const links = [];
  manifestationNodes.forEach(m => {
    const src = nodeById.get(m.plo);
    if (src) links.push({ source: src, target: m, linkType: 'plo' });
  });

  // Similar-manifestation links — scored, so strength and distance vary by score
  const seenPairs = new Set();
  manifestationNodes.forEach(m => {
    (m.similar || []).forEach(({ id: similarId, score }) => {
      const target = nodeById.get(similarId);
      if (!target) return;
      const key = [m.id, similarId].sort().join('--');
      if (seenPairs.has(key)) return;
      seenPairs.add(key);
      links.push({ source: m, target, linkType: 'similar', score: score || 1 });
    });
  });

  function spawnNear(ploId) {
    const p = ploCirclePos(ploId);
    return {
      x: p.x + (Math.random() - 0.5) * 120,
      y: p.y + (Math.random() - 0.5) * 120
    };
  }

  const oldById = sim1
    ? new Map(sim1.nodes().filter(n => n.type === 'manifestation').map(n => [n.id, n]))
    : new Map();
  manifestationNodes.forEach(n => {
    const old = oldById.get(n.id);
    if (old) { n.x = old.x; n.y = old.y; n.vx = old.vx || 0; n.vy = old.vy || 0; }
    else {
      const sp = spawnNear(n.plo);
      n.x = sp.x; n.y = sp.y;
    }
  });

  if (sim1) sim1.stop();

  // Similarity drives the layout: higher score = shorter, stronger link
  const similarScoreDist = { 1: 260, 2: 200, 3: 140, 4: 85, 5: 48 };
  const PLO_TETHER_DIST     = 160;
  const PLO_TETHER_STRENGTH = 1.0;
  // Similarity strength grows with score³ so weak links barely pull: 1→0.0024 … 5→0.30
  const similarStrength = score => (score || 1) ** 3 * 0.0024;

  // Extra repulsion that only acts between PLO nodes, so it spreads the PLOs apart
  // without pushing their own manifestations away
  const ploRepel = d3.forceManyBody().strength(-1200);
  const ploRepelInit = ploRepel.initialize;
  ploRepel.initialize = (all, ...rest) => ploRepelInit(all.filter(n => n.type === 'plo'), ...rest);

  sim1 = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links)
      .id(d => d.id)
      .distance(d => d.linkType === 'similar' ? (similarScoreDist[d.score] || 260) : PLO_TETHER_DIST)
      .strength(d => d.linkType === 'similar' ? similarStrength(d.score) : PLO_TETHER_STRENGTH))
    .force('charge', d3.forceManyBody()
      .strength(d => d.type === 'plo' ? -350 : d.type === 'manifestation' ? -380 : 0))
    .force('ploRepel', ploRepel)
    .force('ploHomeX', d3.forceX(d => d.type === 'plo' ? ploCirclePos(d.id).x : SIM_W * 0.30)
      .strength(d => {
        if (d.type === 'plo') return 0.06;
        if (d.type === 'manifestation') {
          // Bigger ring (more artifacts) → stronger pull to center
          // _nodeRadius range [RING_MIN, RING_MAX]; maps to strength [0.006, 0.05]
          return 0.006 + Math.max(0, (d._nodeRadius || RING_MIN) - RING_MIN) / (RING_MAX - RING_MIN) * 0.044;
        }
        return 0;
      }))
    .force('ploHomeY', d3.forceY(d => d.type === 'plo' ? ploCirclePos(d.id).y : SIM_H * 0.50)
      .strength(d => {
        if (d.type === 'plo') return 0.06;
        if (d.type === 'manifestation') {
          return 0.006 + Math.max(0, (d._nodeRadius || RING_MIN) - RING_MIN) / (RING_MAX - RING_MIN) * 0.044;
        }
        return 0;
      }))
    .force('collide', d3.forceCollide()
      .radius(d => d.type === 'manifestation' ? manifestationCollideRadius(d) : nodeRadius(d) + 6)
      .strength(0.8))
    .force('boundary', boundaryForce(() => SIM_W, () => SIM_H, 10))
    .alphaDecay(0.005)
    .velocityDecay(0.45)
    .stop()
    .on('tick', onTick);

  return { nodes, links, manifestationNodes };
}

/* ═══════════════════════════════════════════════════════════
   SIMULATION 2 — Artifacts
   ═══════════════════════════════════════════════════════════ */
function topManifestationFor(artifact, manifestationNodes) {
  return manifestationNodes.find(m => m.id === artifact.targetManifestationId) || null;
}

function buildArtifactSimulation(visibleArtifacts, manifestationNodes) {
  const oldById = sim2
    ? new Map(sim2.nodes().map(n => [n._uid, { x: n.x, y: n.y, vx: n.vx, vy: n.vy }]))
    : new Map();

  visibleArtifacts.forEach(a => {
    const old = oldById.get(a._uid);
    if (old) {
      a.x = old.x; a.y = old.y; a.vx = old.vx; a.vy = old.vy;
    } else {
      const top = topManifestationFor(a, manifestationNodes);
      const bx = (top?.x != null && top.x > 10) ? top.x : SIM_W * 0.6 + Math.random() * SIM_W * 0.3;
      const by = (top?.y != null) ? top.y : SIM_H * 0.2 + Math.random() * SIM_H * 0.6;
      a.x = bx + (Math.random() - 0.5) * 60;
      a.y = by + (Math.random() - 0.5) * 60;
    }
  });

  if (sim2) sim2.stop();

  sim2 = d3.forceSimulation(visibleArtifacts)
    .force('attract',     customAttractionForce(manifestationNodes))
    .force('mCollide',    manifestationCircleCollisionForce(manifestationNodes))
    .force('distCollide', distanceScaledCollisionForce(manifestationNodes))
    .force('collide',     d3.forceCollide(ARTIFACT_RADIUS + 1).strength(0.4)) // minimal cross-cluster separation
    .force('charge',      d3.forceManyBody().strength(-1))
    .force('boundary',    boundaryForce(() => SIM_W, () => SIM_H, 10))
    .alphaDecay(0.003)
    .velocityDecay(0.4)
    .stop()
    .on('tick', onTick);

  return sim2;
}

/* ═══════════════════════════════════════════════════════════
   TICK HANDLER
   ═══════════════════════════════════════════════════════════ */
function onTick() {
  if (progLinkSel) {
    progLinkSel
      .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
  }
  if (progNodeSel) {
    progNodeSel.attr('transform', d => `translate(${d.x},${d.y})`);
  }
  if (artNodeSel) {
    artNodeSel.attr('cx', d => d.x).attr('cy', d => d.y);
  }
}

/* ═══════════════════════════════════════════════════════════
   DRAG
   ═══════════════════════════════════════════════════════════ */
function makeDrag(simulation) {
  return d3.drag()
    .on('start', (event, d) => {
      if (!event.active) simulation.alphaTarget(0.2).restart();
      if (sim2) sim2.alphaTarget(0.3).restart();
      d.fx = d.x; d.fy = d.y;
    })
    .on('drag', (event, d) => {
      d.fx = event.x; d.fy = event.y;
    })
    .on('end', (event, d) => {
      if (!event.active) simulation.alphaTarget(0);
      if (sim2) sim2.alphaTarget(0);
      if (d.type !== 'plo') {
        d.fx = null; d.fy = null;
      }
    });
}

/* ═══════════════════════════════════════════════════════════
   RENDER HELPERS
   ═══════════════════════════════════════════════════════════ */
function wordsToLines(words, maxChars) {
  const lines = [];
  let current = '';
  for (const word of words) {
    const candidate = current ? current + ' ' + word : word;
    if (candidate.length > maxChars && current) {
      lines.push(current);
      current = word;
    } else {
      current = candidate;
    }
  }
  if (current) lines.push(current);
  return lines.length ? lines : [''];
}

// Collision radius for manifestation nodes in sim1 — ring radius + orbit buffer
function manifestationCollideRadius(d) {
  return nodeRadius(d) + 24;
}

function wrapTextLabel(textNode, lines, lineH) {
  const offsetY = -((lines.length - 1) * lineH) / 2;
  lines.forEach((line, i) => {
    const ts = document.createElementNS('http://www.w3.org/2000/svg', 'tspan');
    ts.setAttribute('x', 0);
    ts.setAttribute('dy', i === 0 ? offsetY : lineH);
    ts.textContent = line;
    textNode.appendChild(ts);
  });
}

/* ═══════════════════════════════════════════════════════════
   RENDER
   ═══════════════════════════════════════════════════════════ */
function renderAll() {
  // ── Program Links ──────────────────────────────────────────
  progLinkSel = svg.select('#layer-prog-links')
    .selectAll('line.prog-link')
    .data(_programLinks, d => `${d.source.id}--${d.target.id}`)
    .join(
      enter => enter.append('line')
        .attr('class', d => d.linkType === 'plo' ? 'prog-link prog-link--plo' : 'prog-link')
        .attr('stroke', d => {
          if (d.linkType !== 'similar') return 'rgba(26,25,22,0.14)';
          // Score 1→5: light gray → darker, matching manifestations_graph aesthetic
          const t = ((d.score || 1) - 1) / 4;
          const v = Math.round(210 + (40 - 210) * t);
          return `rgb(${v},${v},${v})`;
        })
        .attr('stroke-opacity', d => {
          if (d.linkType !== 'similar') return 1;
          return 0.20 + ((d.score || 1) - 1) * 0.16;
        })
        .attr('stroke-width', d => {
          if (d.linkType !== 'similar') return 0.75;
          return 0.3 + ((d.score || 1) - 1) * 0.35;
        }),
      update => update,
      exit   => exit.transition().duration(250).attr('stroke-opacity', 0).remove()
    );

  // ── Program Nodes ──────────────────────────────────────────
  progNodeSel = svg.select('#layer-prog-nodes')
    .selectAll('g.prog-node')
    .data(_programNodes, d => d.id)
    .join(
      enter => {
        const g = enter.append('g')
          .attr('class', d => `prog-node prog-node--${d.type}`)
          .style('cursor', 'grab')
          .call(makeDrag(sim1));

        // Manifestation: hollow ring; PLO: solid dot
        g.append('circle')
          .attr('class', 'node-circle')
          .attr('r',            d => nodeRadius(d))
          .attr('fill',         d => d.type === 'manifestation' ? 'none' : INK)
          .attr('stroke',       INK)
          .attr('stroke-width', d => d.type === 'manifestation' ? 1.5 : 0)
          .attr('fill-opacity', 1);

        // PLO label
        g.filter(d => d.type === 'plo')
          .append('text')
          .attr('class', 'prog-label prog-label--plo')
          .attr('fill', INK)
          .attr('paint-order', 'stroke')
          .attr('stroke', 'rgba(230,224,212,0.9)')
          .attr('stroke-width', '3px')
          .attr('stroke-linejoin', 'round')
          .each(function(d) {
            wrapTextLabel(this, [d.label, ...wordsToLines(d.title.split(' '), 22)], 14);
          });

        // Manifestation label
        g.filter(d => d.type === 'manifestation')
          .append('text')
          .attr('class', 'prog-label')
          .attr('fill', INK)
          .attr('paint-order', 'stroke')
          .attr('stroke', 'rgba(230,224,212,0.9)')
          .attr('stroke-width', '3px')
          .attr('stroke-linejoin', 'round')
          .each(function(d) {
            wrapTextLabel(this, wordsToLines(d.shortLabel.split(' '), 22), 14);
          });

        g.on('mouseover', showProgramTooltip)
         .on('mouseleave', hideTooltip);

        g.filter(d => d.type === 'manifestation')
          .style('cursor', 'pointer')
          .on('click.highlight touchend.highlight', (event, d) => {
            event.stopPropagation();
            if (state.activeManifestationId === d.id) {
              clearManifestationHighlight();
            } else {
              highlightArtifactsForManifestation(d.id);
            }
          });

        return g;
      },
      update => {
        // Update ring radii when sizes recompute
        update.select('circle')
          .attr('r', d => nodeRadius(d));
        return update;
      },
      exit => exit.transition().duration(250).attr('opacity', 0).remove()
    );

  renderArtifactNodes();
  updateArtifactCount();
}

function renderArtifactNodes() {
  artNodeSel = svg.select('#layer-art-nodes')
    .selectAll('circle.artifact')
    .data(_artifactNodes, d => d._uid)
    .join(
      enter => enter.append('circle')
        .attr('class', 'artifact')
        .attr('r', ARTIFACT_RADIUS)
        .attr('fill', INK)
        .attr('fill-opacity', artifactOpacity)
        .attr('stroke', 'none')
        .attr('cx', d => d.x || SIM_W * 0.65)
        .attr('cy', d => d.y || SIM_H * 0.5)
        .on('mouseover', showArtifactTooltip)
        .on('mouseleave', () => {
          // Restore ALL artifact opacities — fixes the dimming-stuck bug
          d3.selectAll('circle.artifact')
            .attr('r', ARTIFACT_RADIUS)
            .attr('stroke', 'none')
            .attr('fill-opacity', state.activeManifestationId
              ? (n => n.targetManifestationId === state.activeManifestationId ? artifactOpacity(n) : 0.15)
              : artifactOpacity);
          hideTooltip();
        }),
      update => update,
      exit   => exit.transition().duration(180)
        .attr('r', 0)
        .attr('fill-opacity', 0)
        .remove()
    );
}

function updateArtifactCount() {
  document.getElementById('artifact-count').textContent =
    `${_artifactNodes.length} instance${_artifactNodes.length !== 1 ? 's' : ''}`;
}

/* ═══════════════════════════════════════════════════════════
   SIMULATION STARTUP
   ═══════════════════════════════════════════════════════════ */
function startSimulations(includeProgram = true) {
  if (includeProgram) {
    sim1.alpha(1);
    for (let i = 0; i < 120; i++) sim1.tick();
    if (progLinkSel) {
      progLinkSel
        .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
        .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    }
    if (progNodeSel) progNodeSel.attr('transform', d => `translate(${d.x},${d.y})`);
    sim1.alpha(0.4).restart();
  }

  sim2.alpha(1);
  for (let i = 0; i < 60; i++) sim2.tick();
  if (artNodeSel) artNodeSel.attr('cx', d => d.x).attr('cy', d => d.y);
  sim2.alpha(0.5).restart();
}

/* ═══════════════════════════════════════════════════════════
   FILTER ORCHESTRATION
   ═══════════════════════════════════════════════════════════ */
function updateFilters(authorOnly = false) {
  computeManifestationSizes();

  if (!authorOnly) {
    const { nodes, links, manifestationNodes } = buildProgramSimulation(state.visiblePlos);
    _programNodes       = nodes;
    _programLinks       = links;
    _manifestationNodes = manifestationNodes;
  }

  const visible = getVisibleArtifacts();
  buildArtifactSimulation(visible, _manifestationNodes);
  _artifactNodes = visible;

  renderAll();
  startSimulations(!authorOnly);
}

/* ═══════════════════════════════════════════════════════════
   SIDEBAR
   ═══════════════════════════════════════════════════════════ */
function renderSidebar() {
  renderPloFilters();
  renderStudentFilters();
}

function renderPloFilters() {
  const container = document.getElementById('plo-filters');
  container.innerHTML = '';
  PROGRAM_DATA.plos.forEach(p => {
    const label = document.createElement('label');
    label.className = 'filter-item plo-filter';
    label.title = p.description;

    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = state.visiblePlos.has(p.id);
    cb.addEventListener('change', () => {
      if (cb.checked) state.visiblePlos.add(p.id);
      else state.visiblePlos.delete(p.id);
      clearManifestationHighlight();
      updateFilters(false);
    });

    const letter = document.createElement('span');
    letter.className = 'plo-letter';
    letter.textContent = p.label.replace(/^PLO\s*/i, '');
    const name = document.createElement('span');
    name.textContent = p.title;
    label.append(cb, letter, name);
    container.appendChild(label);
  });
}

function renderStudentFilters() {
  const container = document.getElementById('author-filters');
  container.innerHTML = '';
  const students = [...new Set(state.allArtifacts.map(a => a.studentId))].filter(Boolean).sort();
  const timers = {};

  students.forEach(student => {
    const label = document.createElement('label');
    label.className = 'filter-item';

    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = state.visibleStudents.has(student);

    // Single click toggles; double click solos (or restores all if already soloed)
    label.addEventListener('click', e => {
      e.preventDefault();
      if (timers[student]) {
        clearTimeout(timers[student]);
        delete timers[student];
        const onlyThisSelected =
          state.visibleStudents.size === 1 && state.visibleStudents.has(student);
        if (onlyThisSelected) {
          students.forEach(s => state.visibleStudents.add(s));
        } else {
          state.visibleStudents.clear();
          state.visibleStudents.add(student);
        }
        renderStudentFilters();
        updateFilters(true);
      } else {
        timers[student] = setTimeout(() => {
          delete timers[student];
          if (state.visibleStudents.has(student)) state.visibleStudents.delete(student);
          else state.visibleStudents.add(student);
          cb.checked = state.visibleStudents.has(student);
          updateFilters(true);
        }, 250);
      }
    });

    const name = document.createElement('span');
    name.textContent = studentLabel(student);
    label.append(cb, name);
    container.appendChild(label);
  });
}

/* ═══════════════════════════════════════════════════════════
   TOOLTIPS
   ═══════════════════════════════════════════════════════════ */
const tooltipEl = document.getElementById('tooltip');

function positionTooltip(event) {
  const wrap = document.getElementById('canvas-wrap');
  const rect = wrap.getBoundingClientRect();
  const ttW = 380, ttH = tooltipEl.offsetHeight || 180;
  const margin = 14;
  let left = event.clientX - rect.left + margin;
  let top  = event.clientY - rect.top  + margin;
  if (left + ttW > rect.width  - 6) left = event.clientX - rect.left - ttW - margin;
  if (top  + ttH > rect.height - 6) top  = event.clientY - rect.top  - ttH - margin;
  tooltipEl.style.left = Math.max(0, left) + 'px';
  tooltipEl.style.top  = Math.max(0, top)  + 'px';
}

function highlightArtifactsForManifestation(mId) {
  state.activeManifestationId = mId;
  d3.selectAll('circle.artifact')
    .attr('r',            d => d.targetManifestationId === mId ? ARTIFACT_RADIUS_HOVER : ARTIFACT_RADIUS)
    .attr('fill-opacity', d => d.targetManifestationId === mId ? artifactOpacity(d) : 0.15);
}

function clearManifestationHighlight() {
  state.activeManifestationId = null;
  d3.selectAll('circle.artifact')
    .attr('r',            ARTIFACT_RADIUS)
    .attr('fill',         INK)
    .attr('fill-opacity', artifactOpacity)
    .attr('stroke',       'none');
}

function restoreProgNodes() {
  // no-op — prog nodes don't change on hover
}

function showArtifactTooltip(event, d) {
  const mInfo = PROGRAM_DATA.manifestations.find(m => m.id === d.targetManifestationId);

  d3.selectAll('circle.artifact')
    .attr('fill-opacity', n => n === d ? 1 : 0.15);

  d3.select(event.currentTarget)
    .attr('r', ARTIFACT_RADIUS_HOVER)
    .attr('fill', INK)
    .attr('stroke', 'rgba(230,224,212,0.6)')
    .attr('stroke-width', 1.5)
    .attr('fill-opacity', 1);

  const excerpt = (d.paragraph || '').trim();
  const snippetLength = 420;
  const snippet = excerpt.length > snippetLength ? excerpt.slice(0, snippetLength) + '…' : excerpt;

  const plo = ploById(d.targetPlo);

  tooltipEl.innerHTML = `
    <div class="tt-title">${studentLabel(d.studentId)}</div>
    <div class="tt-meta">${escapeHtml(d.thesis_title)}</div>
    <hr class="tt-divider">
    <div class="tt-scores-label">${plo ? plo.label + ' · ' : ''}${mInfo ? escapeHtml(mInfo.title) : d.targetManifestationId}</div>
    <div class="tt-meta">${EVIDENCE_LABELS[d.score] || ''} (${d.score}/3)</div>
    <hr class="tt-divider">
    <div class="tt-excerpt">${escapeHtml(snippet)}</div>`;

  tooltipEl.classList.add('visible');
  positionTooltip(event);
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function showProgramTooltip(event, d) {
  if (d.type === 'plo') {
    tooltipEl.innerHTML = `
      <div class="tt-title">${escapeHtml(d.label)} — ${escapeHtml(d.title)}</div>
      <div class="tt-meta">Program Learning Outcome</div>
      <hr class="tt-divider">
      <div class="tt-excerpt">${escapeHtml(d.description)}</div>`;
  } else {
    const plo = ploById(d.plo);
    const n = d._count || 0;
    tooltipEl.innerHTML = `
      <div class="tt-title">${escapeHtml(d.title)}</div>
      <div class="tt-meta">${plo ? escapeHtml(plo.label + ' · ' + plo.title) : ''}</div>
      <div class="tt-meta">${n} evidence point${n !== 1 ? 's' : ''}</div>`;
  }
  tooltipEl.classList.add('visible');
  positionTooltip(event);
}

function hideTooltip() {
  tooltipEl.classList.remove('visible');
}

/* ═══════════════════════════════════════════════════════════
   FILE PICKER
   ═══════════════════════════════════════════════════════════ */
document.getElementById('csv-input').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  const text = await file.text();
  const rows = d3.csvParse(text);
  if (!rows.length) { alert('CSV appears empty.'); return; }

  const missing = REQUIRED_COLS.filter(c => !(c in rows[0]));
  if (missing.length) {
    alert(`CSV is missing required columns:\n${missing.join(', ')}`);
    return;
  }

  processData(rows, true);
  computeManifestationSizes();
  renderSidebar();
  updateFilters(false);
  e.target.value = '';
});

/* ═══════════════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════════════ */
async function init() {
  let csvText = null;
  try {
    const [csvRes, mRes] = await Promise.all([
      fetch('./data/theses_scored.csv').catch(() => null),
      fetch('./manifestations_new.json').catch(() => null)
    ]);
    if (csvRes?.ok) csvText = await csvRes.text();
    if (mRes?.ok) {
      const { plos, manifestations } = normalizeProgram(await mRes.json());
      PROGRAM_DATA.plos = plos;
      PROGRAM_DATA.manifestations = manifestations;
      state.visiblePlos = new Set(plos.map(p => p.id));
    }
  } catch (_) { /* file:// protocol */ }

  const rows = d3.csvParse(csvText || '');
  processData(rows, false);
  computeManifestationSizes();

  setupSVG();
  renderSidebar();

  const { nodes, links, manifestationNodes } = buildProgramSimulation(state.visiblePlos);
  _programNodes       = nodes;
  _programLinks       = links;
  _manifestationNodes = manifestationNodes;

  const visible = getVisibleArtifacts();
  buildArtifactSimulation(visible, _manifestationNodes);
  _artifactNodes = visible;

  renderAll();
  startSimulations();

  const initScale = Math.min(svgWidth / SIM_W, svgHeight / SIM_H) * 2.5;
  const focusX = SIM_W * 0.30;
  const focusY = SIM_H * 0.50;
  const tx = svgWidth  / 2 - focusX * initScale;
  const ty = svgHeight / 2 - focusY * initScale;
  svg.call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(initScale));
}

init();

/* ═══════════════════════════════════════════════════════════
   LABEL VISIBILITY TOGGLES
   ═══════════════════════════════════════════════════════════ */
document.getElementById('toggle-manifestation-labels').addEventListener('change', e => {
  document.getElementById('main-svg').classList.toggle('hide-manifestation-labels', !e.target.checked);
});
document.getElementById('toggle-plo-labels').addEventListener('change', e => {
  document.getElementById('main-svg').classList.toggle('hide-plo-labels', !e.target.checked);
});
</script>
